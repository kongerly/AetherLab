[project]
name = "aetherlab-backend"
version = "0.1.0"
description = "Backend service for AetherLab AI Engineering Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]


[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误检查
    "F",   # Pyflakes
    "I",   # 导入排序
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # 简化代码
    "N",   # 命名规范
    "D",   # 文档字符串
]

ignore = [
    "D100", # 不强制每个文件都有模块文档字符串
    "D415", # 此规则不识别中文句末标点，中文文档字符串由人工检查标点
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
